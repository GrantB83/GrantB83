# USA household Budget automation locks.
# No account numbers, balances, medical notes, or NatPay stub bodies.
schema_version: 1
updated: 2026-08-22
lane: family
owner_bot: Family
approval: Grant locks in chat; this file records them

sheet:
  title: Budget
  drive_path: The Browns USA / Finance
  id: 1XefM6adRfjRIJtYOpCvNcrNqf-R6_jOox68Q4i_32NA
  owner: thebrownsusa@gmail.com
  write_as: thebrownsusa@gmail.com
  editors: [grant, liana]
  grant_phrase_editors: "LIANA SHEET: yes"
  currency: USD
  zar_snapshot: out_of_scope_until_grant_says

books:
  source: monarch_official_csv
  monarch_path: Settings → Data → Download Transactions
  monarch_accounts: BELL ONLY
  dry_run_file_title: 2026-08-22__monarch__bell__transactions
  dry_run_file_id: 1C7YZ8Qaj5wazgm_EEr8ITZVkEJr9YLrO7sUYGW48H30
  category_map: docs/automation/monarch-category-map.yaml
  vehicles: tesla_only
  monarch_gas: tesla_supercharger_to_electricity
  natural_gas_vendor: Texas Gas Service
  natural_gas_not: City of Austin
  city_of_austin: utilities_bundle
  city_of_austin_hold_line: Austin utilities (bundle)
  city_of_austin_grant_phrase: "MAP AUSTIN: utilities-bundle"
  city_of_austin_hold_phrase: "AUSTIN HOLD: new-line"
  city_of_austin_split_source: Grant or Liana downloads the bill from the COA website and uploads the PDF to Drive. Family does not log into COA.
  shopping_hold_line: Shopping (bundle)
  shopping_grant_phrase: "MAP SHOPPING: new-line Shopping"
  shopping_split: autonomous_item_level_from_receipts
  shopping_split_sources:
    - monarch_receipt_images_on_family_bot_session
    - retailer_emails_when_no_monarch_image
  shopping_split_method: AI reads receipt line-item descriptions and assigns each item to a Budget sheet line
  shopping_split_run: family_bot_on_7th_close
  shopping_split_not: this_cloud_vm_daily
  shopping_tax:
    keep_item_level_allocation: true
    agent_does_not_determine_deductibility: true
    agent_does_not_file: true   # N2
    flag_tax_review: true
    never_quote_line_items_in_chat_or_git: true
  shopping_skip_n3: true   # pharmacy / medical item text stays out
  shopping_mailbox_pending: hub_has_amazon_90d_estimate_201_metadata_only
  unofficial_api: never
  stored_passwords: never
  monarch_session: family_bot_computer   # Grant types password; session stays
  natpay_session: family_bot_computer    # numbers only on a Paystubs tab
  recon: Bell statement PDF into The Browns USA / Finance / Bell Bank

close:
  day: 7
  time: "07:00"
  timezone: America/Chicago
  grant_phrase: "CLOSE TIME: 07:00 CT"
  family_does:
    - remind Grant to export Monarch CSV (Bell only)
    - remind Grant to upload Bell statement PDF
    - freeze Budget vs Actual for prior month
    - check sinking target vs MONTH LEFT
    - allocate Shopping (bundle) from Monarch receipt images, else retailer emails (item descriptions → sheet lines; tax-review flag; no N3)
  books_are: monarch_csv_plus_statement
  daily_flash_is_not_books: true
  first_close: dry_run_now
  grant_phrase_first_close: "FIRST CLOSE: dry-run now"
  first_close_date_scheduled: 2026-09-07
  teach_by_doing: now_then_repeat_on_7th

daily_flash:
  mailbox: thebrownsusa@gmail.com
  from: donotreply@customercenter.net
  label: Family/Finance
  skip_inbox: false
  subject_constraint: none
  grant_phrase: "BELL FILTER: from-only"
  create_on_hub: never

funds:
  sinking_official: none_yet
  sinking_target_tab: what the pot should be by objective
  bell_should_hold: sinking_target_plus_month_left
  month_left: unspent intended Essential + Controlled this month

forecast:
  horizon_months: 3
  income_rule: average_last_3_paystubs
  grant_phrase: "FORECAST: average-3"
  fewer_than_3_stubs: average_whatever_exists
  grant_phrase_short: "FORECAST SHORT: use-what-we-have"
  do_not_invent_income: true
  numbers_only_on_paystubs_tab: true
  spend_rule: intended_plan
  spend_includes: [Essential, Controlled, Discretionary, Savings, Sinking_targets]
  grant_phrase_spend: "FORECAST SPEND: intended"
  grant_phrase_discretionary: "FORECAST DISCRETIONARY: include"

archive:
  dated_budget_vs_actual_on_sheet: true
  file_copy_under: The Browns USA / Finance

build_vs_run:
  tabs_formulas_mapping: cursor_cloud_agent_once
  monthly_and_daily_run: family_bot
  cloud_mcp_thebrownsusa: skipped_2026-08-22
  family_amend_prompt: wait_until_remaining_scope_locked   # Grant 2026-08-22

never:
  - N1 payments
  - N3 medical/will/tax-emigration bodies
  - quote amounts or last-four in chat or git
  - unofficial Monarch APIs
  - determine tax deductibility or file income tax
  - quote receipt line items or prices in chat or git
