  time: "07:00"
  timezone: America/Chicago
  grant_phrase: "CLOSE TIME: 07:00 CT"
  family_does:
    - remind Grant to export Monarch CSV (Bell only)
    - remind Grant to upload Bell statement PDF
    - freeze Budget vs Actual for prior month
    - check sinking target vs MONTH LEFT
    - allocate Shopping (bundle) from Monarch receipt images, else retailer emails (item descriptions → sheet lines; tax-review flag; no N3)
  books_are: monarch_csv_plus_statement
  daily_flash_is_not_books: true
  first_close: dry_run_now
  grant_phrase_first_close: "FIRST CLOSE: dry-run now"
  first_close_date_scheduled: 2026-09-07
  teach_by_doing: now_then_repeat_on_7th

