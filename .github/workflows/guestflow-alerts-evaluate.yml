# Hobby Vercel rejects sub-daily crons, so the 10-minute evaluator
# is driven here. The route stays idempotent at /api/cron/alerts-evaluate.
# Configure the named var/secret below. Do not invent values.
name: GuestFlow alerts evaluate

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/alerts-evaluate
        env:
          GUESTFLOW_APP_URL: ${{ vars.GUESTFLOW_APP_URL }}
          GUESTFLOW_EVALUATE_URL: ${{ vars.GUESTFLOW_EVALUATE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          url="${GUESTFLOW_EVALUATE_URL:-}"
          if [ -z "$url" ] && [ -n "${GUESTFLOW_APP_URL:-}" ]; then
            url="${GUESTFLOW_APP_URL%/}/api/cron/alerts-evaluate"
          fi
          if [ -z "$url" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "GUESTFLOW_EVALUATE_URL / GUESTFLOW_APP_URL or CRON_SECRET unset; skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/gf-eval.json -w '%{http_code}' --max-time 40 \
            -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "$url" || echo 000)
          echo "HTTP $code"
          cat /tmp/gf-eval.json || true
          test "$code" = "200"
